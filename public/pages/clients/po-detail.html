<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Purchase Order Detail</title>
    <link rel="shortcut icon" href="/assets/images/company_icon.ico" type="image/x-icon">
    <link href="/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/bootstrap/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .po-header-bg { background-color: #f8f9fa; border-bottom: 2px solid #0d6efd; }
        .table-po th { background-color: #0d6efd; color: white; }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex">
        <div id="sidebar-display"></div>
        <div class="flex-grow-1">
            <div id="header-display"></div>
            
            <div class="container-fluid py-4">
                <main class="bg-white rounded shadow-sm p-4 mx-auto" style="max-width: 1000px;">
                    
                    <div class="row mb-4 po-header-bg pb-3 pt-2 rounded-top">
                        <div class="col-md-6">
                            <h2 class="fw-bold text-primary" id="company-name-sender">Company Name</h2>
                            <address class="mb-0 text-muted" id="company-address-display">
                                </address>
                            <div class="mt-2 text-muted">
                                <strong>Phone:</strong> <span id="phone-display"></span><br>
                                <strong>Email:</strong> <span id="email-display"></span>
                            </div>
                        </div>
                        
                        <div class="col-md-6 text-md-end mt-3 mt-md-0">
                            <h1 class="fs-1 fw-bold text-uppercase">Purchase Order</h1>
                            <div class="mt-3">
                                <p class="mb-1"><strong>PO Number:</strong> <span id="po-number-display" class="badge bg-secondary fs-6"></span></p>
                                <p class="mb-1"><strong>Date:</strong> <span id="date-display"></span></p>
                                <p class="mb-1"><strong>Status:</strong> <span id="status-display" class="badge bg-info text-dark"></span></p>
                            </div>
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-header bg-primary text-white fw-bold">VENDOR</div>
                                <div class="card-body" id="vendor-display">
                                    </div>
                            </div>
                        </div>
                        
                        <div class="col-md-6 mt-3 mt-md-0">
                            <div class="card h-100 border-0 shadow-sm">
                                <div class="card-header bg-primary text-white fw-bold">SHIP TO</div>
                                <div class="card-body" id="shipto-display">
                                    </div>
                            </div>
                        </div>
                    </div>

                    <div class="table-responsive mb-4">
                        <table class="table table-bordered mb-0">
                            <thead class="table-light text-center">
                                <tr>
                                    <th>SOURCE TYPE</th>
                                    <th>EXPECTED DELIVERY</th>
                                    <th>TERMS & CONDITIONS</th>
                                </tr>
                            </thead>
                            <tbody id="ship-detail" class="text-center">
                                </tbody>
                        </table>
                    </div>

                    <div class="table-responsive mb-4">
                        <table class="table table-bordered table-striped table-hover table-po">
                            <thead class="text-center">
                                <tr>
                                    <th width="5%">NO</th>
                                    <th width="45%">ITEM & DESCRIPTION</th>
                                    <th width="10%">QTY</th>
                                    <th width="20%">UNIT PRICE</th>
                                    <th width="20%">TOTAL</th>
                                </tr>
                            </thead>
                            <tbody id="item-list">
                                </tbody>
                            <tfoot id="calculation-list">
                                <tr>
                                    <td colspan="3" class="border-0"></td>
                                    <td class="text-end fw-bold">SUBTOTAL</td>
                                    <td class="text-end" id="subtotal-display">0</td>
                                </tr>
                                <tr>
                                    <td colspan="3" class="border-0"></td>
                                    <td class="text-end fw-bold">TAX</td>
                                    <td class="text-end" id="tax-display">0</td>
                                </tr>
                                <tr>
                                    <td colspan="3" class="border-0"></td>
                                    <td class="text-end fw-bold">SHIPPING</td>
                                    <td class="text-end" id="shipping-display">0</td>
                                </tr>
                                <tr class="table-primary">
                                    <td colspan="3" class="border-0 bg-white"></td>
                                    <td class="text-end fw-bold">GRAND TOTAL</td>
                                    <td class="text-end fw-bold fs-5" id="grand-total-display">0</td>
                                </tr>
                            </tfoot>
                        </table>
                    </div>
                </main>
            </div>
        </div>
    </div>

    <script type="module" src="/assets/js/shared/auth.js"></script>
    <script type="module" src="/assets/js/layout/nav.js"></script>
    <script type="module" src="/assets/js/layout/sidebar.js"></script>
    <script type="module" src="/assets/js/modules/procurements/purchase_orders/po.detail.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="/assets/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
