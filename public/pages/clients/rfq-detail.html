<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RFQ</title>
    <link rel="shortcut icon" href="/assets/images/company_icon.jpg" type="image/x-icon">
    <link href="/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/bootstrap/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .card{
            width:700px;
            height:1000px;
        }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex">
        <div id="sidebar-display"></div>
        <div class="flex-grow-1">
            <div id="header-display"></div>
            <main class="p-2 d-flex justify-content-center">
                <div class="card shadow-sm p-3" id="rfq-print">
                    <div class="card-title text-center">
                        <h3 class="fw-bold fs-2">Request Of Quotation</h3>
                        <h4 class="fs-3">No. <span id="rfq-number"></span></h4>
                    </div>
                    <div class="card-info">
                        <table class="table table-striped-columns border">
                            <tbody id="table-info"></tbody>
                        </table>
                    </div>
                    <div class="card-items">
                        <table class="table">
                            <thead>
                                <tr>
                                    <th>Number Item</th>
                                    <th>Name</th>
                                    <th>Spesification</th>
                                    <th>Quantity</th>
                                    <th>Request Delivery Date</th>
                                    <th>Notes</th>
                                </tr>
                            </thead>
                            <tbody id="table-items"></tbody>
                        </table>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/layout/nav.js"></script>
    <script type="module" src="/assets/js/layout/sidebar.js"></script>
    <script type="module" src="/assets/js/modules/procurements/clients/rfq.detail.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="/assets/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
