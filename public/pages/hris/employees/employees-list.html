<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="shortcut icon" href="/assets/images/company_icon.ico" type="image/x-icon">

        <div id="sidebar-display"></div>
        <div class="flex-grow-1">
            <div id="header-display"></div>
            <main class="m-2">
                <div class="d-flex">
                    <div class="p-2 table-container bg-light rounded shadow-sm">

                            <button class="btn btn-primary" id="add-employee" onclick="window.location.href = './add-employee.html'">Add Employee</button>
                        </div>

                        <div class="p-1">
                            <table class="table">
                                <thead>
                                    <tr>
                                        <th>ID</th>
                                        <th>NAME</th>
                                        <th>DEPARTMENT</th>
                                        <th>POSITION</th>
                                        <th>STATUS</th>
                                    </tr>
                                </thead>
                                <tbody id="table-body"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/shared/auth.js"></script>
    <script type="module" src="/assets/js/layout/nav.js"></script>
    <script type="module" src="/assets/js/layout/sidebar.js"></script>
