<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee</title>
    <link rel="shortcut icon" href="/assets/images/company_icon.ico" type="image/x-icon">
    <link href="/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/bootstrap/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="d-flex">
        <div id="sidebar-display"></div>
        <div class="flex-grow-1">
            <div id="header-display"></div>
            <main class="m-2 d-flex justify-content-center">
                <div class="shadow-sm p-2">
                    <h1 class="fw-bold">Add Employees</h1>
                    <hr>
                    <form id="add-employee">
                        <div class="row m-2">
                            <div class="col-4">
                                <label for="">Employee Name</label>
                                <input type="text" class="form-control" id="name-input" placeholder="Employee Name" required>
                            </div>
                            <div class="col-4">
                                <label for="">Gender</label>
                                <select class="form-control" id="gender-input" required>
                                    <option value="">Select Gender</option>
                                    <option value="male">Male</option>
                                    <option value="female">Female</option>
                                </select>
                            </div>
                            <div class="col-4">
                                <label for="">Date of Birth</label>
                                <input type="date" class="form-control" id="date-birth-input" required>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-12">
                                <label for="">Address</label>
                                <textarea id="address-input" class="form-control" placeholder="Address"></textarea>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-6">
                                <label for="">Email</label>
                                <input type="text" class="form-control" id="email-input" placeholder="Email" required>
                            </div>
                            <div class="col-6">
                                <label for="">Phone Number</label>
                                <input type="text" class="form-control" id="phone-input" placeholder="Phone Number" required>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-6">
                                <label for="">Bank Name</label>
                                <select class="form-control" id="bank-name-input" required></select>
                            </div>
                            <div class="col-6">
                                <label for="">Account Number</label>
                                <input type="number" class="form-control" id="account-number-input" placeholder="Account Number" required>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-6">
                                <label for="">Ptkp</label>
                                <select class="form-control" id="ptkp-input" required></select>
                            </div>
                            <div class="col-6">
                                <label for="">Role</label>
                                <select class="form-control" id="role-input" required></select>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-12">
                                <label for="">Join Date</label>
                                <input type="date" class="form-control" id="join-date-input" required>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-12">
                                <label for="">Employment Status</label>
                                <select id="status-id" class="form-control"></select>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-6">
                                <label for="">Start Work</label>
                                <input type="date" class="form-control" id="start-work-input" required placeholder="Start Work">
                            </div>
                            <div class="col-6">
                                <label for="">End Work</label>
                                <input type="date" id="end-work-input" class="form-control" required placeholder="End Work">
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-12">
                                <label for="">Job</label>
                                <select class="form-control" id="job-input" required></select>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-6">
                                <label for="">Department</label>
                                <input type="text" class="form-control" id="department-input" placeholder="Department" disabled>
                            </div>
                            <div class="col-6">
                                <label for="">Positions</label>
                                <input type="text" class="form-control" id="position-input" placeholder="Positions" disabled>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-12">
                                <label for="">Upload Image (Comming Soon)</label>
                                <input type="file" class="form-control" id="image-input" placeholder="Upload or Drag File" disabled>
                            </div>
                        </div>
                        <div class="row m-2">
                            <div class="col-12">
                                <input type="password" class="form-control" id="password-input" placeholder="Password">
                            </div>
                        </div>
                        <div class="class m-2">
                            <div class="col-12 d-flex justify-content-center">
                                <button class="btn btn-primary">Add Employees</button>
                            </div>
                        </div>
                    </form>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/shared/auth.js"></script>
    <script type="module" src="/assets/js/layout/nav.js"></script>
    <script type="module" src="/assets/js/layout/sidebar.js"></script>
    <script type="module" src="/assets/js/modules/hris/employees/employee.add.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="/assets/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
