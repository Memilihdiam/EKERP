<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Projects</title>
    <link rel="shortcut icon" href="/assets/images/company_icon.jpg" type="image/x-icon">
    <link href="/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/bootstrap/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="d-flex">
        <div id="sidebar-display"></div>
        <div class="flex-grow-1">
            <div id="header-display"></div>
            <main class="p-3">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h3 class="text-dark">Project Detail</h3>
                    <a href="/pages/projects/project.html" class="btn btn-secondary">Back to Project List</a>
                </div>

                <div id="project-detail-content">
                    <!-- Loading Spinner -->
                    <div id="loading-spinner" class="text-center">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>

                <div class="card mt-4" id="details-tab" style="display: none;">
                    <div class="card-header">
                        <ul class="nav nav-tabs card-header-tabs" id="project-tabs" role="tablist">
                            <li class="nav-item" role="presentation">
                                <button class="nav-link active" id="budget-tab" data-bs-toggle="tab" data-bs-target="#budget" type="button" role="tab" aria-controls="budget" aria-selected="true">Budget</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="tasks-tab" data-bs-toggle="tab" data-bs-target="#tasks" type="button" role="tab" aria-controls="tasks" aria-selected="false">Tasks</button>
                            </li>
                            <li class="nav-item" role="presentation">
                                <button class="nav-link" id="milestones-tab" data-bs-toggle="tab" data-bs-target="#milestones" type="button" role="tab" aria-controls="milestones" aria-selected="false">Milestones</button>
                            </li>
                        </ul>
                    </div>
                    <div class="card-body">
                        <div class="tab-content" id="project-tabs-content">
                            <div class="tab-pane fade show active" id="budget" role="tabpanel" aria-labelledby="budget-tab">
                                <h5 class="card-title">Budget Details</h5>
                                <div id="budget-details"></div>
                            </div>
                            <div class="tab-pane fade" id="tasks" role="tabpanel" aria-labelledby="tasks-tab">
                                <h5 class="card-title">Task List</h5>
                                <div id="tasks-details"></div>
                            </div>
                            <div class="tab-pane fade" id="milestones" role="tabpanel" aria-labelledby="milestones-tab">
                                <h5 class="card-title">Milestones</h5>
                                <div id="milestones-details"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/layout/sidebar.js"></script>
    <script type="module" src="/assets/js/layout/nav.js"></script>
    <script type="module" src="/assets/js/modules/projects/managements/project.detail.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="/assets/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
