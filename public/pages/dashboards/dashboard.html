<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard</title>
    <link rel="shortcut icon" href="/assets/images/company_icon.ico" type="image/x-icon">
    <link href="/assets/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="/assets/bootstrap/bootstrap-icons/bootstrap-icons.min.css" rel="stylesheet">
    <style>
        .card-lift:hover{
            box-shadow:2px 3px 2px #8d8d8d;
            transform:scale(1.02);
        }
        .progress-bar{
            border:1px solid black;
            width:90%;
            height:10px;
            text-align:center;
        }
        .table-container {
            max-height: 450px;
            overflow-y: auto;
        }
        .table-container thead th {
            position: sticky;
            top: 0;
            background-color: white;
            z-index: 2;
        }
    </style>
</head>
<body class="bg-light">
    <div class="d-flex">
        <div id="sidebar-display"></div>
        <div class="flex-grow-1">
            <div id="header-display"></div>
            <main class="p-4">
                <div class="row align-items-center mb-4">
                    <div class="col-md-8">
                        <h4 class="fw-bold mb-1">Welcome, <span id="display-name"></span></h4>
                    </div>
                    <div class="col-md-4 d-flex justify-content-end">
                        <div class="badge text-bg-primary">
                            <i class="bi bi-calendar"></i> <span id="now-date"></span>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-12">
                        <div class="card shadow-sm p-2">
                            <div class="card-title border-bottom">
                                <h3 class="fw-bold fs-4">Procurement Reviews</h3>
                            </div>
                            <div id="total-display">
                                <div class="row g-3 m-2">
                                    <div class="col-md-6 shadow-sm">
                                        <div class="display-title">
                                            <h3 class="fs-4">Projects</h3>
                                        </div>
                                        <div class="m-2 d-flex justify-content-center">
                                            <div id="progress-project" class="progress-bar"></div>
                                        </div>
                                        <div id="project-legend"></div>
                                    </div>
                                    <div class="col-md-6 shadow-sm">
                                        <div class="display-title">
                                            <h3 class="fs-4">Clients</h3>
                                        </div>
                                        <div class="m-2 d-flex justify-content-center">
                                            <div id="progress-client" class="progress-bar"></div>
                                        </div>
                                        <div id="client-legend"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-5">
                        <div class="card shadow-sm p-2">
                            <div class="card-title border-bottom">
                                <h3 class="fw-bold fs-4">Value</h3>
                            </div>
                            <div class="row g-3">
                                <div class="col-6">
                                    <div class="card-lift justify-content-center border text-center">
                                        <h3 class="fs-4">Quotation</h3>
                                        <div id="quotation-value-display"></div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="card-lift justify-content-center border text-center">
                                        <h3 class="fs-4">Purchase Order</h3>
                                        <div id="po-value-display"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-7">
                        <div class="card shadow-sm p-2">
                            <div class="card-title border-bottom">
                                <h3 class="fw-bold fs-4">Invoices Payment</h3>
                            </div>
                            <div class="row g-3">
                                <div class="col-6">
                                    <div class="card-lift justify-content-center border text-center">
                                        <h3 class="fs-4">Paid</h3>
                                        <div id="invoice-paid-display"></div>
                                    </div>
                                </div>
                                <div class="col-6">
                                    <div class="card-lift justify-content-center border text-center">
                                        <h3 class="fs-4">Unpaid</h3>
                                        <div id="invoice-unpaid-display"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="row g-3 mb-3">
                    <div class="col-md-12">
                        <div class="card shadow-sm p-2">
                            <div class="card-title border-bottom">
                                <h3 class="fw-bold fs-4">Task In Urgent</h3>
                                <p class="fw-lighter">Deadline Time Task</p>
                            </div>
                            <div id="task-display" class="table-container"></div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>
    <script type="module" src="/assets/js/shared/auth.js"></script>
    <script type="module" src="/assets/js/layout/nav.js"></script>
    <script type="module" src="/assets/js/layout/sidebar.js"></script>
    <script type="module" src="/assets/js/modules/dashboards/dashboard.user.js"></script>
    <script type="module" src="/assets/js/modules/dashboards/dashboard.review.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.8/dist/umd/popper.min.js"></script>
    <script src="/assets/bootstrap/js/bootstrap.min.js"></script>
</body>
</html>
